version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: mysql_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: my_application_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Optional: Put your schema.sql file in a ./init folder to auto-import it on first boot
      - ./init:/docker-entrypoint-initdb.d 

volumes:
  mysql_data:
