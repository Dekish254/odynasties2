version: '3.8'

services:
  # 1. Your Application Container
  app:
    build: . # or image: your-app-image
    container_name: app_container
    restart: always
    ports:
      - "8000:8000" # Change to your app's port
    depends_on:
      - db # Forces the app to wait until the DB container starts
    environment:
      - DB_HOST=db  # <-- CRITICAL: Must match the service name below, NOT localhost
      - DB_PORT=3306
      - DB_DATABASE=my_application_db
      - DB_USERNAME=app_user
      - DB_PASSWORD=app_password

  # 2. Your MySQL Container
  db:
    image: mysql:8.0
    container_name: mysql_database
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: my_application_db
      MYSQL_USER: app_user
      MYSQL_PASSWORD: app_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # <-- This mounts your existing SQL file into Docker's auto-init folder
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql 

volumes:
  mysql_data:
